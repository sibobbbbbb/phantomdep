name: Blocklist update

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @phantomdep/blocklist build
      - name: Run blocklist update
        run: pnpm --filter @phantomdep/blocklist update
      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(blocklist): scheduled update"
          title: "chore(blocklist): scheduled update"
          body: "Automated blocklist refresh. Review the added hallucinated package names before merging."
          branch: chore/blocklist-update
          add-paths: packages/blocklist/data/*.json
